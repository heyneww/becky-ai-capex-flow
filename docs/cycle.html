<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="AI 供应链压力走到了哪一环：股价、信用、现金流、capex 指引、订单、价格、月营收七环传导链，接 AI 订单与债务账本，自动更新。">
<title>AI 供应链周期实时报告</title>
<style>
/* 版式：顶部一条「压力传导链」定调，其下按 信号表 → 三层 → 资金 → 市场 → 跟踪节奏 逐层展开；冷灰纸面 + 靛蓝墨色，状态色只用于状态 */
:root{
  --bg:#f3f5f8;--card:#fcfcfb;--ink:#101623;--sub:#4a5468;--mute:#7c8596;--line:#dfe3ea;--line2:#c6ccd6;--wash:#eaeef4;
  --accent:#1f4fa8;--accent-wash:#e3ebf9;
  --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;
  --good-ink:#0a6b0a;--warn-ink:#7a5200;--crit-ink:#a32222;--good-wash:#e4f4e4;--warn-wash:#fdf1d3;--crit-wash:#fbe4e4;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;
  --up:#0a6b0a;--down:#b52a2a;
  --font:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1117;--card:#171b23;--ink:#eceff4;--sub:#b3bccb;--mute:#8791a3;--line:#272d39;--line2:#394150;--wash:#1e2430;
  --accent:#7fa8f0;--accent-wash:#1b2740;
  --good-ink:#5fd15f;--warn-ink:#fac555;--crit-ink:#f08a8a;--good-wash:#12301a;--warn-wash:#3a2e0c;--crit-wash:#3b1717;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;
  --up:#5fd15f;--down:#f08a8a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1117;--card:#171b23;--ink:#eceff4;--sub:#b3bccb;--mute:#8791a3;--line:#272d39;--line2:#394150;--wash:#1e2430;
  --accent:#7fa8f0;--accent-wash:#1b2740;
  --good-ink:#5fd15f;--warn-ink:#fac555;--crit-ink:#f08a8a;--good-wash:#12301a;--warn-wash:#3a2e0c;--crit-wash:#3b1717;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;
  --up:#5fd15f;--down:#f08a8a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65;font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
a:focus-visible,summary:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1{font-size:28px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.2px;text-wrap:balance}
h2{font-size:20px;margin:0;font-weight:700;text-wrap:balance}
h3{font-size:16px;margin:0;font-weight:650}
p{margin:0}
.back{font-size:13px;color:var(--mute);text-decoration:none;align-self:flex-start}.back:hover{text-decoration:underline}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--mute);font-weight:600}
.sub{color:var(--sub)}.mute{color:var(--mute)}.sm{font-size:13px}.xs{font-size:12px}
.head{display:flex;flex-direction:column;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:16px}
.stamps{display:flex;flex-wrap:wrap;gap:6px 8px}
.stamp{font-size:12px;color:var(--sub);background:var(--wash);border-radius:999px;padding:2px 10px;white-space:nowrap}
.stamp b{color:var(--ink);font-weight:600}
section{display:flex;flex-direction:column;gap:14px;min-width:0}
.wrap>*{min-width:0}
.sec-head{display:flex;flex-direction:column;gap:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.snap{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-wash);border-radius:4px;padding:1px 7px;white-space:nowrap;vertical-align:middle}
/* 结论 */
.verdict{display:flex;flex-direction:column;gap:10px}
.verdict .big{font-size:19px;font-weight:650;line-height:1.5;text-wrap:balance}
.verdict p{max-width:68em}
/* 状态 */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill i{font-style:normal;font-size:10px;line-height:1}
.st-on{background:var(--crit-wash);color:var(--crit-ink)}.st-watch{background:var(--warn-wash);color:var(--warn-ink)}
.st-off{background:var(--good-wash);color:var(--good-ink)}.st-na{background:var(--wash);color:var(--mute)}
/* 传导链 */
.chain{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.node{position:relative;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 10px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.node::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;border-radius:8px 8px 0 0;background:var(--line2)}
.node.on::before{background:var(--crit)}.node.watch::before{background:var(--warn)}.node.off::before{background:var(--good)}
.node .nm{font-weight:650;font-size:14px;line-height:1.3}
.node .val{font-size:12px;color:var(--sub);line-height:1.4;overflow-wrap:anywhere}
.node .cad{font-size:11px;color:var(--mute)}
.node .step{font-size:11px;color:var(--mute);font-weight:600}
.chain-note{font-size:13px;color:var(--sub)}
@media(max-width:860px){.chain{grid-template-columns:minmax(0,1fr)}.node{flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:10px 12px 10px 16px}
  .node::before{left:0;top:0;bottom:0;right:auto;width:4px;height:auto;border-radius:8px 0 0 8px}.node .nm{flex:1 1 auto}.node .val{flex:1 1 100%}}
/* 表格 */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--mute);white-space:nowrap;background:transparent}
tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right;white-space:nowrap}
.pos{color:var(--up)}.neg{color:var(--down)}
.sig{min-width:860px}.sig td:first-child{min-width:190px}.sig .v{font-weight:650;white-space:nowrap}
.grp td{background:var(--wash);font-weight:650;font-size:12.5px;padding:5px 10px;color:var(--sub)}
/* 三层 */
.layer{display:flex;flex-direction:column;gap:14px}
.lhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.track span{font-size:12px;text-align:center;padding:4px 2px;border-radius:5px;background:var(--wash);color:var(--mute);font-weight:600}
.track span.on{background:var(--accent);color:#fff}
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px}
@media(max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.lbl{font-size:12px;font-weight:650;color:var(--mute);letter-spacing:.04em;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.bk:last-child{border-bottom:none}
.bk .t{font-weight:650;font-size:14px}.bk .m{font-size:12px;color:var(--sub)}
.bk svg{display:block}
.rd{display:flex;flex-direction:column;gap:2px;padding:9px 0;border-bottom:1px solid var(--line)}
.rd:last-child{border-bottom:none}
.rd .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rd .nm{font-weight:650;font-size:14px}
.dir{font-size:11px;font-weight:650;border-radius:4px;padding:0 6px;white-space:nowrap}
.dir.hot{background:var(--accent-wash);color:var(--accent)}.dir.cool{background:var(--warn-wash);color:var(--warn-ink)}.dir.flat{background:var(--wash);color:var(--sub)}
.rd .val{font-size:13px;color:var(--ink);overflow-wrap:anywhere}
.rd .note{font-size:12.5px;color:var(--sub)}
.rd .src{font-size:11.5px;color:var(--mute);overflow-wrap:anywhere}
details>summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600;padding:6px 0;list-style-position:inside}
.call{background:var(--wash);border-radius:8px;padding:11px 14px;font-size:14px}
/* 数字块 */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:12px;color:var(--mute);font-weight:600}.tile .v{font-size:20px;font-weight:700;line-height:1.3}.tile .d{font-size:12px;color:var(--sub)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:900px){.grid3{grid-template-columns:minmax(0,1fr)}}
.chart-card{display:flex;flex-direction:column;gap:8px}
.chart-card h3{font-size:15px}
.cx{overflow-x:auto}.cx svg{display:block;width:100%;height:auto;min-width:420px}.cx.lc{overflow:visible}.cx.lc svg{min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:baseline}
.li:last-child{border-bottom:none}
.li .dt{color:var(--mute);font-size:12px;white-space:nowrap}.li .am{font-weight:650;white-space:nowrap}
.tag{font-size:11px;font-weight:600;color:var(--sub);background:var(--wash);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.hbar{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.hbar .b{height:10px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.hbar .b.lab{background:var(--s2)}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.5;padding:6px 9px;border-radius:6px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#tip b{font-weight:650}
.foot{font-size:12.5px;color:var(--sub);display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:16px}
ul.plain{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.err{background:var(--crit-wash);color:var(--crit-ink);padding:12px 14px;border-radius:8px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card">正在读取数据…</div></div>
<div id="tip" hidden></div>
<script>
const EMBED = /*__DATA__*/null;
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST = { on: ['已触发', '▲'], watch: ['观察', '◆'], off: ['未触发', '●'], na: ['待补', '○'] };
const pill = (s) => `<span class="pill st-${s}"><i>${ST[s][1]}</i>${ST[s][0]}</span>`;
const yi = (v) => { if (v == null || v === 0) return '未披露'; const a = Math.abs(v); if (a >= 1e12) return (v / 1e12).toFixed(2) + ' 万亿'; if (a >= 1e9) return Math.round(v / 1e8).toLocaleString('en-US') + ' 亿'; if (a >= 1e8) return (v / 1e8).toFixed(1) + ' 亿'; return Math.round(v / 1e4).toLocaleString('en-US') + ' 万'; };
const pct = (v, d = 1) => v == null ? '–' : `<span class="${v > 0 ? 'pos' : v < 0 ? 'neg' : ''}">${v > 0 ? '+' : ''}${v.toFixed(d)}%</span>`;
const ago = (iso) => { const m = Math.round((Date.now() - new Date(iso)) / 6e4); return m < 60 ? `${m} 分钟前` : m < 2880 ? `${Math.round(m / 60)} 小时前` : `${Math.round(m / 1440)} 天前`; };
const local = (iso) => new Date(iso).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
const cssv = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- 提示框 ---------- */
const tip = document.getElementById('tip');
function bindTips(root) {
  root.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('pointermove', e => { tip.innerHTML = el.dataset.tip; tip.hidden = false;
      const w = tip.offsetWidth, x = Math.min(e.clientX + 12, innerWidth - w - 8); tip.style.left = Math.max(8, x) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });
    el.addEventListener('pointerleave', () => tip.hidden = true);
  });
}

/* ---------- 图表（SVG，单一刻度） ---------- */
function niceScale(lo, hi, target = 4) { const raw = (hi - lo) / target || 1, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step; return { lo: a, hi: b, step, ticks: Math.round((b - a) / step) }; }
function niceMax(v) { return niceScale(0, v).hi; }
function axis(W, H, m, max, min, fmt, ticks) { ticks = ticks || niceScale(min, max).ticks;
  let g = ''; const ih = H - m.t - m.b;
  for (let i = 0; i <= ticks; i++) { const v = min + (max - min) * i / ticks, y = m.t + ih - ih * i / ticks;
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${m.l - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--mute)">${fmt(v)}</text>`; }
  return g;
}
function stackedBars(rows, keys, labels, colors, { xKey, fmtX, unit, W = 720, H = 260 }) {
  const m = { t: 12, r: 8, b: 26, l: 46 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const max = niceMax(Math.max(...rows.map(r => keys.reduce((s, k) => s + (r[k] || 0), 0))));
  const bw = iw / rows.length, w = Math.min(34, bw * .62);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">` + axis(W, H, m, max, 0, v => Math.round(v).toLocaleString('en-US'));
  rows.forEach((r, i) => {
    const x = m.l + bw * i + (bw - w) / 2; let y = m.t + ih; const tot = keys.reduce((a, k) => a + (r[k] || 0), 0);
    const tipH = `<b>${fmtX(r[xKey])}</b><br>` + keys.map((k, j) => `${labels[j]} ${Math.round(r[k]).toLocaleString('en-US')} ${unit}`).join('<br>') + `<br><b>合计 ${Math.round(tot).toLocaleString('en-US')} ${unit}</b>`;
    let segs = ''; const nz = keys.filter(k => r[k] > 0);
    keys.forEach((k, j) => { const h = (r[k] || 0) / max * ih; if (h <= 0) return; const top = k === nz[nz.length - 1];
      const hh = Math.max(h - 2, 1); y -= h;
      segs += top ? `<path d="M${x},${y + hh} v${-(hh - Math.min(4, hh))} q0,${-Math.min(4, hh)} ${Math.min(4, hh)},${-Math.min(4, hh)} h${w - 2 * Math.min(4, hh)} q${Math.min(4, hh)},0 ${Math.min(4, hh)},${Math.min(4, hh)} v${hh - Math.min(4, hh)} z" fill="${colors[j]}"/>` : `<rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="${colors[j]}"/>`; });
    s += `<g data-tip="${esc(tipH)}">${segs}<rect x="${m.l + bw * i}" y="${m.t}" width="${bw}" height="${ih}" fill="transparent"/></g>`;
    if (rows.length <= 8 || i % 2 === (rows.length - 1) % 2) s += `<text x="${m.l + bw * i + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--mute)">${fmtX(r[xKey])}</text>`;
  });
  return s + `<line x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}" stroke="var(--line2)"/></svg>`;
}
function groupedBars(rows, keys, labels, colors, { xKey, unit, note, W = 720, H = 260 }) {
  const m = { t: 22, r: 8, b: 26, l: 46 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const max = niceMax(Math.max(...rows.flatMap(r => keys.map(k => r[k]))));
  const bw = iw / rows.length, w = Math.min(22, bw * .32);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">` + axis(W, H, m, max, 0, v => Math.round(v).toLocaleString('en-US'));
  rows.forEach((r, i) => {
    const cx = m.l + bw * i + bw / 2;
    const tipH = `<b>${r[xKey]}</b><br>` + keys.map((k, j) => `${labels[j]} ${Math.round(r[k]).toLocaleString('en-US')} ${unit}`).join('<br>') + (note ? `<br><b>${note(r)}</b>` : '');
    let bars = '';
    keys.forEach((k, j) => { const h = r[k] / max * ih, x = cx - w - 1 + j * (w + 2), y = m.t + ih - h, c = Math.min(4, h);
      bars += `<path d="M${x},${y + h} v${-(h - c)} q0,${-c} ${c},${-c} h${w - 2 * c} q${c},0 ${c},${c} v${h - c} z" fill="${colors[j]}"/>`; });
    const topY = m.t + ih - Math.max(...keys.map(k => r[k])) / max * ih;
    s += `<g data-tip="${esc(tipH)}">${bars}<rect x="${m.l + bw * i}" y="${m.t}" width="${bw}" height="${ih}" fill="transparent"/></g>`;
    if (note) s += `<text x="${cx}" y="${topY - 6}" text-anchor="middle" font-size="11" font-weight="650" fill="var(--ink)">${note(r)}</text>`;
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--mute)">${r[xKey]}</text>`;
  });
  return s + `<line x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}" stroke="var(--line2)"/></svg>`;
}
function lines(series, colors, { W = 380, H = 250 }) {
  const m = { t: 10, r: 104, b: 22, l: 34 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const all = series.flatMap(s => s.series.map(p => p[1]));
  const sc = niceScale(Math.min(...all, 100), Math.max(...all, 100)), lo = sc.lo, hi = sc.hi;
  const n = Math.max(...series.map(s => s.series.length));
  const X = i => m.l + iw * i / (n - 1), Y = v => m.t + ih - (v - lo) / (hi - lo) * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" data-lines>` + axis(W, H, m, hi, lo, v => Math.round(v), sc.ticks);
  s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(100)}" y2="${Y(100)}" stroke="var(--line2)" stroke-dasharray="3 3"/>`;
  const ends = series.map((sr, j) => ({ j, y: Y(sr.series[sr.series.length - 1][1]), sr })).sort((a, b) => a.y - b.y);
  for (let k = 1; k < ends.length; k++) if (ends[k].y - ends[k - 1].y < 13) ends[k].y = ends[k - 1].y + 13;
  series.forEach((sr, j) => { const off = n - sr.series.length;
    s += `<path d="${sr.series.map((p, i) => (i ? 'L' : 'M') + X(i + off).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join('')}" fill="none" stroke="${colors[j]}" stroke-width="2" stroke-linejoin="round"/>`;
    const lp = sr.series[sr.series.length - 1]; s += `<circle cx="${X(n - 1)}" cy="${Y(lp[1])}" r="4" fill="${colors[j]}" stroke="var(--card)" stroke-width="2"/>`; });
  ends.forEach(e => { s += `<text x="${W - m.r + 8}" y="${e.y + 4}" font-size="11" fill="var(--sub)"><tspan fill="${colors[e.j]}">■</tspan> ${esc(e.sr.zh.split(' ')[0].slice(0, 8))} ${Math.round(e.sr.last)}</text>`; });

  } catch (e) { document.getElementById('app').innerHTML = `<div class="err">数据读取失败：${esc(e.message)}</div>`; }
})();
</script>

</body>
</html>
