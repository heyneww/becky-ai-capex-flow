    date: '2025-08-29'
    tier: 1
    quote: This new lease agreement with CoreWeave brings Applied Digital’s total anticipated contracted lease revenue to approximately $11B, which includes $7B in revenue from the initial two approximately 15-year leases executed in May of this year.
  verify_note: The ~$4.0B figure is stated only in the 8-K body ("expected to be approximately $4.0 billion"); the press release gives the campus total (~$11B) and the prior $7B, from which ~$4B follows. The lease was signed 2025-08-28 and announced 2025-08-29; "announced" uses the release date. The 8-K calls the facility "Building 4" while the press release says the "third building" for CoreWeave – same 150 MW building. CoreWeave had exercised its option for this 150 MW earlier (the 8-K says "in the first fiscal quarter of 2025", which looks like a fiscal-year wording slip); the definitive lease dates from August 2025. Check that the ledger's existing CRWV → APLD edge for the two May 2025 leases carries ~$7B only, so this $4B is not double counted. The Seeking Alpha lead and ir.applieddigital.com were not opened; the SEC exhibit is the same release.
