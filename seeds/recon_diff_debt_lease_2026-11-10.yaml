  title_en: 'CoreWeave signs third Polaris Forge 1 lease with Applied Digital: 150 MW, ~$4.0B over ~15 years (campus total 400 MW, ~$11B)'
  summary_zh: 2025 年 8 月 28 日 Applied Digital 子公司与 CoreWeave 签署 Polaris Forge 1 园区（北达科他州 Ellendale）的第三份数据中心租约，租下 Building 4 全部 150 MW 容量，8 月 29 日对外公布。8-K 披露该租约初始约 15 年租期的合同总价值预计约 40 亿美元，条款与 2025 年 5 月的两份租约基本相同，预计 2027 年年中可投入使用。至此 CoreWeave 在该园区共租用 400 MW，Applied Digital 预计的合同租赁收入合计约 110 亿美元（其中 5 月两份租约约 70 亿美元）。Applied Digital 同时向 CoreWeave 发行了可认购最多 8,393,611 股、行权价 10.75 美元的认股权证。
