  verify_note: The $9.5B is explicitly "contracted revenue to the joint venture" (100% basis); TeraWulf's economic share at announcement was 51%, so its attributable share was roughly $4.8B (derived, not stated). The figure assumes the full 25-year term; footnote 1 allows the term to be shortened to 20 or 15 years, so the firm minimum is lower and not disclosed. The release says "majority stake of 51%"; the ledger's later entry for TeraWulf's sale of its JV stake (July 2026) uses 50.1% – that sale is already in the ledger and was not re-researched here, so the 51% vs 50.1% difference is unreconciled. The end customer is described only as "a global hyperscale AI platform developing frontier-scale foundation models"; it is not named in this release. The lessor is the JV, recorded under WULF as majority owner at signing.
