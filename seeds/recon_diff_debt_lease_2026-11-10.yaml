  verify_note: 'GL''s $1.4B → $1.73B is confirmed ($1.4B + $333M = $1.733B; the company rounds to $1.73 Billion). The 8-K body describes the backstop only as "certain obligations of Fluidstack"; the dollar amounts come from the press releases. The backstop is a contingent, amortizing cap (maximum termination fee), not cash paid, and what would actually be received is the lesser of outstanding debt and the scheduled termination fee. Whether the September 2026 lease amendment (see notes) changed the backstop was not checked: neither the 2026-09-25 8-K nor its press release mentions Google. The Q3 2026 10-Q carries a $544.5 million asset for the value of the Google backstop, which is the warrant fair value at issuance, not the backstop amount.'
