    quote: was $24.6 billion as of December 31, 2025. A significant amount of the balance was attributable to the Company’s obligations pursuant to a master relationship agreement with OpenAI
  - url: https://www.cnbc.com/2026/04/17/cerebras-new-ipo-ai-chips.html
    title: AI chipmaker Cerebras files to go public after scrapping IPO plans last year
    publisher: CNBC
    date: '2026-04-17'
    tier: 3
    quote: The deal is valued at over $20 billion, Cerebras said.
  verify_note: 'Status is ''signed'', not ''amended'': the S-1, both S-1/As and the 424B4 describe a single MRA dated 2025-12-24 with 750 MW committed, and a full-text search of the prospectus finds no amendment to it; the exhibit list carries only the original agreement and the January 2026 promissory note. The warrant (Dec 2025) and $1.0B loan (Jan 2026) were part of the original deal, not an April add-on. So the other tracker''s ''doubled in April'' is a re-valuation against January press figures (''over $10 billion'', sourced to people close to the company), not a contract change. ''announced'' is the S-1 public filing date, the first official statement of the >$20B value; The Information''s report (2026-04-16/17, paywalled, not opened) is not used as a source. amount_usd is the floor of ''more than $20 billion''; the exact OpenAI share of the $24.6B RPO is not disclosed. The 6% loan rate comes from CNBC only.'
