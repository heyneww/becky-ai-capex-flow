    title: Cerebras Systems Inc. – Form S-1 (filed 2026-04-17)
    publisher: SEC EDGAR (Cerebras Systems Inc.)
    date: '2026-04-17'
    tier: 1
    quote: In January 2026, we announced a multi-year deal with OpenAI valued at more than $20 billion dollars. OpenAI has agreed to deploy 750 megawatts
  - url: https://www.sec.gov/Archives/edgar/data/2021728/000162828026035214/cerebras-424b4.htm
    title: Cerebras Systems Inc. – Prospectus, Rule 424(b)(4) (IPO at $185.00 per share)
    publisher: SEC EDGAR (Cerebras Systems Inc.)
    date: '2026-05-14'
