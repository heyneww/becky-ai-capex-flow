  title_en: Cerebras S-1 values its 750 MW OpenAI compute agreement at more than $20B, with warrant and $1B working-capital loan
  summary_zh: 2026 年 4 月 17 日 Cerebras 公开递交 S-1，首次由公司自己给出与 OpenAI 合同的金额：2026 年 1 月宣布的多年期协议价值超过 200 亿美元，OpenAI 承诺购买 750MW 推理算力，2026–2028 年分批交付，每批期限 3–4 年、可延至 5 年；OpenAI 另有再买 1.25GW（合计 2GW，2030 年底前部署）的选择权。配套条款：OpenAI 于 2026 年 1 月提供约 10 亿美元营运资金贷款（最迟 2032 年底到期，可用算力抵还），并在 2025 年 12 月获得可认购 33,445,026 股 Class N 股票的权证（行权价 0.00001 美元），只有买满 2GW 才全部归属。1 月 14 日宣布时媒体口径为「100 亿美元以上」，本条按 S-1 更正金额；合同本身并未在 4 月修订或扩容。
  sources:
