    title: TeraWulf Inc. – Form 10-Q for the quarter ended 2026-09-30
    publisher: SEC EDGAR (TeraWulf Inc.)
    date: '2026-11-06'
    tier: 1
    quote: 'for aggregate cash consideration of approximately $530.0 million. The sale was effective as of July 5, 2026. The consideration is payable in three installments: $250.0 million within 14 days following the effective date which was received in July 2026'
  verify_note: 'Date: no TeraWulf filing supports 2026-07-01. The 8-K gives July 6, 2026 as both the announcement and the ''Closing Date''; the Q2 10-Q (filed 2026-08-05) says the agreement was entered into and effective July 6, 2026, while the Q3 10-Q (filed 2026-11-06) says July 5, 2026. ''announced'' is therefore set to 2026-07-06, with supersedes pointing at the existing amount-less 2026-07-01 record; drop that line and restore 07-01 if the ledger key must stay unchanged. Buyers are Fluidstack CS I Inc. ''and certain other purchasers'', and the split between them is not disclosed, so the full $530M is attributed to FLUIDSTACK. Status ''completed'' because ownership transferred at signing; $280M of consideration was still deferred at 2026-09-30 (carrying amount $272.8M). The Q3 10-Q words the third installment as due on the earlier of the campus commencing operations and a date in April 2027.'
