  summary_zh: 2026 年 7 月 6 日 TeraWulf 在 8-K 中宣布，子公司 Big Country Wulf LLC 与 Fluidstack CS I Inc. 及其他买方签署股权购买协议，出售其在 FS CS I LLC（德州 Abernathy 168MW AI 数据中心合资公司）的全部 50.1% 权益，总对价约 5.3 亿美元现金，分三期支付：签约后 14 天内 2.5 亿（已于 7 月收到）、2026 年底前 1.5 亿、2027 年 4 月 30 日前约 1.3 亿（可调整）。TeraWulf 此前累计投入约 4.5 亿美元，三季度确认出售收益 9500 万美元；交易后项目由 Fluidstack 主导，TeraWulf 把资金转投自有园区（同日宣布与 Anthropic 的 Justified 园区 20 年租约）。
