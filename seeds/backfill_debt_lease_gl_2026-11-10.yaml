  verify_note: 'What was signed and when: BINDING, on 2026-10-27 – NAVER''s exchange filing says it and NAVER Cloud have signed (체결한) the investment and operating agreement with Green Holding L.P., and its amended business-plan filing gives the reason ''computing infrastructure contract signing completed''; the GPUaaS supply and GPU operation agreements with Asset Co. are ''to be signed'' (체결할 예정) once that company exists. The July stage was not a signing: the joint press release (dated 24 July in San Francisco, 2026.07.25 on NAVER''s site) speaks of ''agreements'', but NAVER''s 2026-07-27 filing says the $9B structure was a proposal with formal contract talks under way and Brookfield given 12 weeks of exclusivity. Hence announced = 2026-10-27 (the ledger candidate''s date is right; the lead''s 2026-07-27 is the non-binding stage). AMOUNT IS A JUDGMENT CALL: because the deal is binding I recorded the lessee-side maximum that NAVER itself filed (KRW 18.74T ≈ $14.11B), following the ledger''s
    lease rule (rent, not lessor capex). It is a ceiling: the filing says no payment obligation is fixed at the disclosure date and the figure moves with GPU investment timing, interest and exchange rates. Alternatives: 9000000000 (Brookfield''s investment cap, the headline) or null if the ledger treats uncommitted ceilings like MOUs. The candidate''s KRW 13.3T / $9.95B could not be found in any filing or article opened. Other caveats: (1) Asset Co. will be consolidated by NAVER under K-IFRS despite being 100% Brookfield-funded, so this is closer to on-balance-sheet financing than a third-party lease; (2) the filing describes Brookfield''s fund as run by ''Brookfield Corporation Ltd.'' while NAVER''s July filing says ''Brookfield Asset Management'' – BAM is kept as the counterparty; (3) Seoul Economic Daily''s ''up to eight years'' is the guarantee window (Oct 2026 to Dec 2034), while fees per tranche run six years; (4) a KRW 10.7T loan for the Brookfield vehicle arranged by KB Kookmin Bank
    was reported on 2026-11-01 (fnnews) and is not included here. USD conversion uses ECB euro reference rates for 2026-10-27 (cross rate 1,327.75 KRW per USD).'
