  verify_note: 'Exact principal ($1,004,571,259), note date (January 5, 2026), 6% interest, December 31, 2032 maturity, lockbox use-of-proceeds restriction and first-priority security interest all confirmed in the Secured Promissory Note itself (Exhibit 10.12 to the S-1; portions redacted with [***], including the amortisation schedule and the cap on repayment through services). The S-1 body only says ''approximately $1.0 billion'' / ''$1.0 billion Working Capital Loan''. The S-1 was filed on EDGAR 2026-04-17, not 2026-04-20 as in the lead. Collateral is the lockbox account and cash in it only – the note states the collateral does not include assets acquired with permitted disbursements from the account (though on mandatory repayment OpenAI may elect to take assignment of assets paid for from the lockbox). Three-year amortisation ''commencing after the delivery of the final tranche of the initial 250 MW'' is from the S-1 risk factors. Outstanding principal: $982,923K at March 31, 2026 (Q1
    10-Q filed 2026-06-24, https://www.sec.gov/Archives/edgar/data/2021728/000162828026044981/cbrs-20260331.htm – this is the lead''s ''about $983M'') and $918,244K at June 30, 2026 (Q2 10-Q); the Q2 10-Q cash-flow statement shows ''Proceeds from Working Capital Loan 1,004,571'' ($ thousands). The lead''s ''Loan from customer'' balance-sheet caption was not found under that name in the filings searched. The S-1 says the OpenAI deal was ''valued at more than $20 billion dollars'' (750 MW committed capacity, option for a further 1.25 GW); the 10-Q notes the warrant was partially exercised for 10,033,508 Class N shares in July 2026. The S-1/A filings (2026-05-04, 2026-05-11), the 424B4 (2026-05-14) and the TechCrunch article in the lead were not opened. Status ''completed'' = loan funded in January 2026; it remains outstanding.'
