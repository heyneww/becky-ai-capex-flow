  summary_zh: 阿里巴巴于 2025 年 9 月 11 日定价、9 月 16 日完成发行本金 31.68 亿美元（公司口径「约 32 亿美元」）的零息可转换优先票据，2032 年 9 月 15 日到期，仅向非美国投资者发售。初始转换价每 ADS 193.15 美元（溢价 31.25%），公司同时买入封顶看涨期权，把有效转换价提高到 235.46 美元（溢价 60%）。公司明确募集资金用于一般公司用途：约 80% 投向云基础设施（扩建数据中心、技术升级、改善服务），约 20% 用于国际电商业务扩张。预计净额约 31.3 亿美元。
