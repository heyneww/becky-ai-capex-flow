  title_zh: 腾讯发行 18 亿美元 + 260 亿元人民币双币种优先票据，合计约 56.8 亿美元
  title_en: Tencent prices US$1.8B + CNY26B dual-currency senior notes (about US$5.68B) under its GMTN programme
  summary_zh: 腾讯于 2026 年 10 月 13 日（纽约时间）在全球中期票据计划下定价 18 亿美元和 260 亿元离岸人民币优先无担保票据，按当日欧洲央行参考汇率合计约 56.8 亿美元，10 月 21 日完成发行并在港交所上市。分四档：2036 年到期 13 亿美元（6.10%）、2046 年到期 5 亿美元（6.75%）、2036 年到期 200 亿元人民币（2.40%）、2056 年到期 60 亿元人民币（3.00%）。港交所公告写明募集资金用于「一般公司用途」，没有专门指向 AI 资本开支；同期公告披露腾讯 2026 年上半年资本开支 963 亿元人民币（上年同期 459 亿元），路透称认购订单超过 230 亿美元。这是继 2026 年 6 月之后四个月内的第二次双币种发债。
