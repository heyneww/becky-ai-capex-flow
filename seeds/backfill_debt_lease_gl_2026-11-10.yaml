  verify_note: 'Lease announced by the financier (Apollo press release, 2026-01-07: VCI, a fund managed by Valor Equity Partners, acquires and leases $5.4B of compute to an xAI subsidiary under a triple net lease; NVIDIA is an anchor LP in VCI) and confirmed by the lessee''s parent in the SpaceX 424B4 (filed 2026-06-12). The rent figure the lead calls ''undisclosed'' IS disclosed: $6,633M. Mapping caveat: the prospectus lists three Valor leases by ordinal – (i) $6,986M, (ii) ''a second'' $6,633M, (iii) ''a third'' $6,587M – and separately dates them (Valor transaction: 2025-10-12; Valor transaction II: January 2026; Valor transaction III: 2026-04-24, whose $6,587M matches item iii). I therefore match the January 2026 lease to item (ii); the filing never puts ''January 2026'' and ''$6,633 million'' in the same sentence. The recorded debt of $5,365M for transaction II lines up with Apollo''s $5.4B, which supports the match. The prospectus names the lessor only as ''Valor Equity Partners (together
