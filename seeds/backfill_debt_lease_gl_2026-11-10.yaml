  title_en: OpenAI advances Cerebras a $1.0046B secured working-capital loan (6%, due by end-2032, repayable in compute) alongside its 750 MW compute agreement
  summary_zh: 作为 2025 年 12 月 24 日主关系协议（MRA，OpenAI 承诺采购 750MW 推理算力，Cerebras 称该合作价值超过 200 亿美元）的一部分，OpenAI 于 2026 年 1 月向 Cerebras 发放营运资金贷款，2026 年 1 月 5 日签署的有担保本票载明本金为 1,004,571,259 美元。贷款年息 6%，最迟 2032 年 12 月 31 日到期，可随时无罚金提前偿还；Cerebras 可用现金偿还，也可通过交付算力、硬件或其他服务抵还，以服务抵还的部分对应利息视同已付。款项须存入专用锁箱账户（lockbox），只能用于加快相关服务的研发、制造与数据中心建设，OpenAI 对该账户及其中资金享有第一顺位担保权益；若 MRA 因 OpenAI 重大未补救违约以外的原因终止，贷款立即到期。贷款到账同时触发 OpenAI 认股权证（最多 33,445,026 股 N 类普通股，行权价 0.00001 美元）首批 4,459,337 股归属。截至 2026 年 6 月 30 日，Cerebras 未做任何现金还款，已通过 8,630 万美元非现金服务抵扣将本金余额降至 9.18 亿美元。
