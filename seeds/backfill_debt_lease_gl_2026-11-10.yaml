  verify_note: 'Confirmed at tier 1: MediaTek''s TWSE material-information filing of 2026-08-31 (read in both the English MOPS text and the Chinese original) gives the total (US$3,900,000 thousand), 0% coupon, five-year tenor, conversion price and names NVIDIA Corporation as the specific-person subscriber for US$3.5 billion. Confirmed at tier 2 by the joint press release on both the NVIDIA and MediaTek sites. So this is a real debt instrument (convertible bonds) bought by NVIDIA, and both companies confirmed it; the lead said coupon, maturity and conversion terms were unconfirmed - they are in the filing. Direction differs from the lead (which had from nvidia to mediatek): under this ledger''s convention the issuer MediaTek is ''from'' and the buyer NVIDIA is ''to''. Status is ''signed'' because the filing gives 2026-09-08 only as the tentative issue date and I found no closing notice on MOPS for September-November 2026 (the press release''s ''has invested'' and the S&C client note of 2
