  verify_note: 'RUMORED – one original source only. The Information''s article is paywalled: I could read only its headline and public teaser (quoted above; published 2025-09-04, not 09-08 as in the lead), which gives the $1.3B / 10,000 / four-year leg; the $200M / 8,000-server leg and the ''largest customer'' point come from RCR Wireless and Tom''s Hardware, both of which merely repeat The Information. No Reuters or Bloomberg story independently confirming the $1.5B was found. No Lambda S-1 is on EDGAR (only Form D filings from 2022 and 2024), and NVIDIA''s 10-Q does not name Lambda (its ''cloud service agreements'' commitments are disclosed only in aggregate, $29B at 2026-07-26). Later corroboration that a Lambda-to-NVIDIA contract exists, but not of this amount or even necessarily this deal: Bloomberg''s 2026-08-10 story (headline only seen: ''Lambda Sells $917 Million Loan to Fund Nvidia Chip Deal'') and TechCrunch''s line that the $926M loan funds GB300s ''for a deployment it''s under
    contract to provide Nvidia''; Lambda''s own release says only ''an investment-grade offtaker''. GB300 systems did not exist in summer 2025, so the 2026 financing may relate to a newer or amended arrangement. The Information says ''AI chips'', RCR says ''servers'' – units are loosely reported.'
