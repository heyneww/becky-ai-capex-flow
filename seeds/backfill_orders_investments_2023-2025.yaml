  summary_zh: 2025 年 12 月 24 日 Groq 宣布与英伟达签订推理技术非独家许可协议，创始人 Jonathan Ross、总裁 Sunny Madra 等团队成员加入英伟达；Groq 继续独立运营，由 Simon Edwards 接任 CEO，GroqCloud 不在交易内。CNBC 援引 Groq 领投方 Disruptive 的 CEO Alex Davis 报道对价约 200 亿美元现金，英伟达未确认价格，黄仁勋内部信称“不是收购 Groq 公司”。英伟达 2026 财年现金流量表单列 Groq, Inc. 投资性现金流出 130 亿美元，为该交易已付现金的一手佐证。 金额按英伟达 FY2026 现金流量表披露的 130 亿美元记；CNBC 报道的约 200 亿美元总价未获英伟达确认。
