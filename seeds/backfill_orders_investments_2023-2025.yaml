    title: NVIDIA Announces Financial Results for Fourth Quarter and Fiscal 2026 (8-K Exhibit 99.1; cash-flow line 'Groq, Inc.' (13,000) $M)
    publisher: SEC EDGAR (NVIDIA 8-K)
    date: '2026-02-25'
    tier: 1
    quote: Entered into a non-exclusive licensing agreement with Groq to accelerate AI inference at global scale.
  - url: https://www.cnbc.com/2025/12/24/nvidia-buying-ai-chip-startup-groq-for-about-20-billion-biggest-deal.html
    title: Nvidia buying AI chip startup Groq's assets for about $20 billion in its largest deal on record
    publisher: CNBC
    date: '2025-12-24'
    tier: 3
    quote: While we are adding talented employees to our ranks and licensing Groq's IP, we are not acquiring Groq as a company.
  verify_note: 200 亿美元仅 CNBC 一家原始报道（消息源为 Disruptive 的 Alex Davis），Groq 与英伟达均未披露总价；一手可核实的数字是英伟达 FY2026 现金流量表中 Groq, Inc. 一行的 130 亿美元流出（截至 2026-01-25），差额是否为后续分期支付未见披露。英伟达 10-K 风险因素称该许可“required significant, nonrefundable payments”。
