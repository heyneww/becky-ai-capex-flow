verdict:
  headline: "钱的一侧已经按泡沫破裂定价，货的一侧还没松。压力走完了股价、信用、现金流三环，正在敲 capex 指引和订单这两环的门。"
  paras:
    - "<b>货还紧。</b>台湾 13 家供应链公司 10 月营收同比仍在加速，台积电 +59.7%。Nvidia 上季数据中心收入环比 +21%，SK hynix 的 DRAM 和 HBM 订到 2029 年，CoWoS 还在谈涨价。转松的只有三处：NAND 合约价被 TrendForce 预测 2027 年一季度转跌，消费级 DRAM 在 PC 厂手里开始累库存，GE Vernova 的燃机新增订单放慢。"
    - "<b>钱先紧了。</b>五家巨头最新一季 capex 已经超过经营现金流，谷歌、亚马逊、Meta、甲骨文单季自由现金流都是负的，只有微软还是正的。CoreWeave 的 5 年期 CDS 在 11 月 20 日升到 1,233bp，甲骨文 328bp。全链 56 只样本没有一只站在 50 日线上方，Neocloud 篮子距高点跌去七成，存储篮子跌去近六成。"
    - "<b>接下来看哪一环先动。</b>如果是融资收紧倒逼砍开支，顺序会是：发债变难，然后有人下修 2027 年 capex，然后撤单增多，最后才是交期缩短和月营收减速。如果只是股价超跌，这几环会一直不动。所以现在最该盯的是第 2、4、5 环：近 30 天发债额、1 月财报季的 2027 年 capex 指引、账本里的撤单。"
  chain_note: "第 4 到第 6 环处于观察，第 7 环月营收还没有任何减速。"
