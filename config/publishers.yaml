# 媒体来源归一化。recompute_tier 用它数「几家独立媒体」。
# 规则：publisher 名或域名小写、去 www / 顶级域 / 标点后，含 aggregators 里任一关键字的，算转载 / 聚合站，
#       只能作为正文来源，不计入「两家独立媒体互相印证」的门槛；aliases 把同一媒体的不同写法并成一家。
