aliases:               # canonical: [写法…]，匹配为「归一化后包含」
  reuters: [reuters]
  bloomberg: [bloomberg, bgov]
  techcrunch: [techcrunch]
  the register: [theregister]
  dcd: [datacenterdynamics, data center dynamics]
